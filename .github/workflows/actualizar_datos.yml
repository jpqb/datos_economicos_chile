name: "🇨🇱 Actualización Diaria de Datos Económicos de Chile"

on:
  schedule:
    # 03:15 UTC = 00:15 hora de Chile continental (captura del cambio de día)
    - cron: '15 3 * * *'
    # 12:15 UTC = 09:15 hora de Chile continental (segunda pasada matutina por publicaciones de IPC/UF)
    - cron: '15 12 * * *'
  workflow_dispatch: # Permite ejecutar manualmente el flujo desde la pestaña 'Actions' de GitHub

permissions:
  contents: write # Necesario para hacer commit y push de los nuevos datos

jobs:
  actualizar-datos:
    name: "Extracción y Publicación Oficial"
    runs-on: ubuntu-latest

    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Configurar entorno Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Instalar dependencias necesarias"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Ejecutar extractor oficial de la UF"
        run: |
          python src/extraer_uf.py

      - name: "Publicar cambios en el repositorio (Git Commit & Push)"
        run: |
          git config --global user.name "Antigravity Data Bot"
          git config --global user.email "bot-datos@ucen.cl"
          
          # Verificar si hubo cambios en la carpeta de datos
          git add data/
          if git diff --staged --quiet; then
            echo "ℹ️ No se detectaron cambios en los datos. El repositorio ya está al día."
          else
            FECHA_ACTUAL=$(date +'%Y-%m-%d')
            git commit -m "chore(datos): actualización oficial UF al $FECHA_ACTUAL [skip ci]"
            git push
            echo "✅ Datos actualizados y publicados exitosamente en GitHub."
          fi
